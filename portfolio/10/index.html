lash”. But in the end it’s just too obvious, so he’s name&quot;],&quot;date&quot;:[0,&quot;2024-02-05&quot;],&quot;aws_media_src_url&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2024/02/2024-02-05_22-11-19_UTC.jpg&quot;]}],&quot;render&quot;:[0,null],&quot;date&quot;:[0,&quot;2024-02-05&quot;],&quot;title&quot;:[0,&quot;All the youngsters out there probably have no idea why I wanted to name this guy “Flash”. But in the end it’s just too obvious, so he’s name&quot;],&quot;img&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2024/02/2024-02-05_22-11-19_UTC.jpg&quot;]}],[0,{&quot;id&quot;:[0,&quot;2024/02/ig-C27UlC2uqOP.md&quot;],&quot;slug&quot;:[0,&quot;ig-C27UlC2uqOP&quot;],&quot;body&quot;:[0,&quot;\nSome clips from about 12 years ago, one of my early shows, the Deja Vu Recycled Art Fair, at The Commons in Columbus Indiana. “Ann Dromeda” won best in show. In the lobby of The Commons was Jean Tinguely’s “Chaos” sculpture, which was actually in that spot when they demolished the old “Commons” and they had to construct this new building around the sculpture. A great venue and a great show, I only wish NY had the same interest in recycled art, and maybe show devoted to it. \\#jeantinguely \\#columbusindiana \\#thecommons \\#dejavuartshow \\#dejavurecycledartfair \\#recycledartwork\n\n\n![](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2024/02/2024-02-04_13-35-41_UTC.jpg)\n  \n[View on Instagram](https://www.instagram.com/p/C27UlC2uqOP/)&quot;],&quot;collection&quot;:[0,&quot;portfolio&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Some clips from about 12 years ago, one of my early shows, the Deja Vu Recycled Art Fair, at The Commons in Columbus Indiana. “Ann Dromeda” &quot;],&quot;date&quot;:[0,&quot;2024-02-04&quot;],&quot;aws_media_src_url&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2024/02/2024-02-04_13-35-41_UTC.jpg&quot;]}],&quot;render&quot;:[0,null],&quot;date&quot;:[0,&quot;2024-02-04&quot;],&quot;title&quot;:[0,&quot;Some clips from about 12 years ago, one of my early shows, the Deja Vu Recycled Art Fair, at The Commons in Columbus Indiana. “Ann Dromeda” &quot;],&quot;img&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2024/02/2024-02-04_13-35-41_UTC.jpg&quot;]}],[0,{&quot;id&quot;:[0,&quot;2024/01/ig-C2qQjH4OWkx.md&quot;],&quot;slug&quot;:[0,&quot;ig-C2qQjH4OWkx&quot;],&quot;body&quot;:[0,&quot;\nIt’s finally complete. I colorized the grout a metallic gold. That was pretty scary because I had to basically paint the whole skull metallic gold over the cobalt pieces, and then wipe it down with lacquer thinner to clean off the excess gold paint. And had to repeat that a few times. Lost a few brain cells in the process, I’m sure, but eventually got it to the point where the cobalt was all clean and the grout stayed gold. Then I added a nice thick coat of clear epoxy over the entire skull. Pretty happy with the result! Final photoshoot still to come. \\#echtcobalt \\#cobaltandgold \\#bavariancobalt \\#cobaltskull \\#skullmosaic \\#stargazer \\#skulpture \\#nothingsshocking \\#janesaddiction \\#unlikelyjapan\n\n\n![](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2024/01/2024-01-28_22-25-26_UTC.jpg)\n  \n[View on Instagram](https://www.instagram.com/p/C2qQjH4OWkx/)&quot;],&quot;collection&quot;:[0,&quot;portfolio&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;It’s finally complete. I colorized the grout a metallic gold. That was pretty scary because I had to basically paint the whole skull metalli&quot;],&quot;date&quot;:[0,&quot;2024-01-28&quot;],&quot;aws_media_src_url&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2024/01/2024-01-28_22-25-26_UTC.jpg&quot;]}],&quot;render&quot;:[0,null],&quot;date&quot;:[0,&quot;2024-01-28&quot;],&quot;title&quot;:[0,&quot;It’s finally complete. I colorized the grout a metallic gold. That was pretty scary because I had to basically paint the whole skull metalli&quot;],&quot;img&quot;:[0,&quot;//pub-5541d2 l],&quot;date&quot;:[0,&quot;2023-01-12&quot;],&quot;title&quot;:[0,&quot;Some highlights from last year!&quot;],&quot;img&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2023/01/2023-01-12_17-47-41_UTC.jpg&quot;]}],[0,{&quot;id&quot;:[0,&quot;2023/01/ig-CnUw17fO37k.md&quot;],&quot;slug&quot;:[0,&quot;ig-CnUw17fO37k&quot;],&quot;body&quot;:[0,&quot;\nMore progress on the dragon scales this week. Next comes his head and claws, and last but not least his foot with the pearl. I haven’t decided on what I will use here yet, but if you are wondering why Asian dragons hold pearls, here is the legend…. The story starts in a rural province in central China, ruled by a greedy emperor. The crops are failing and the people are dying of hunger and thirst. A boy finds a field of grass, which grows back each time he ploughs it. He digs up a turf to take home and under it finds a pearl. When he takes the pearl home and hides it in a sack of rice the field dies but the rice sack overflows. He and his mother share their good fortune with their neighbours and in time the emperor hears about it. The boys hides the pearl by swallowing it – and becomes a dragon who from then on protects the land and its people.\n\n\n![](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2023/01/2023-01-12_18-01-27_UTC_8.jpg)\n![](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2023/01/2023-01-12_18-01-27_UTC_1.jpg)\n![](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2023/01/2023-01-12_18-01-27_UTC_3.jpg)\n![](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2023/01/2023-01-12_18-01-27_UTC_2.jpg)\n![](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2023/01/2023-01-12_18-01-27_UTC_6.jpg)\n![](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2023/01/2023-01-12_18-01-27_UTC_7.jpg)\n![](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2023/01/2023-01-12_18-01-27_UTC_5.jpg)\n![](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2023/01/2023-01-12_18-01-27_UTC_4.jpg)\n  \n[View on Instagram](https://www.instagram.com/p/C [0,&quot;2012-03-08T13:19:33&quot;],&quot;aws_media_src_url&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/dscn1150.jpg&quot;]}],&quot;render&quot;:[0,null],&quot;date&quot;:[0,&quot;2012-03-08T13:19:33&quot;],&quot;title&quot;:[0,&quot;HMS Honeybee&quot;],&quot;img&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/dscn1150.jpg&quot;]}],[0,{&quot;id&quot;:[0,&quot;2012/03/skeezix-in-neverwhere.md&quot;],&quot;slug&quot;:[0,&quot;skeezix-in-neverwhere&quot;],&quot;body&quot;:[0,&quot;\n My buddy Kathleen gave me this antique German Bisque doll, sans head, and the doll had SKEEZIX embossed across the back of his shoulders. It was a name I recalled having heard from my parents when I was young, but I had no idea who he was. So I did a little Wikipedia research. Apparently he came from the very old comic strip “Gasoline Alley” (see article posted below).\n\n Neverwhere is the title of the book I’m currently reading, I’ll post some info on that below also.\n\n Together, the doll and the novel helped me create this Assemblage. I wanted to experiment with doing my mosaic/sculpture type stuff INSIDE A FRAME to see if it would be easier to sell artwork in the gallery if it was framed and hangable. I had this feeling that people have trouble buying a sculpture because they wonder how to display it properly, or WHERE to display it properly, whereas a painting, or framed piece of artwork is easy, you bring it home and hang it on a wall.\n\n So I found this old mirror, the type where the silver backing is all spotted. The frame around it was also mirrored, and spotted. The orange and light green glass was from two “crackle glass” type vases I picked up at the goodwill store. The dark grey stone is slate I had left over from the mosaic fireplace I did recently. The wings I added to skeezix were from a 99 cent angel I found t the goodwill store. After everything was glued to the mirror, I poured clear epoxy resin over it, about 1/4″ thick, that encased all the pieces, except for skeezix, who is breaking free.\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/skeezix-detail3.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/skeezix-detail3.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/skeezix-detail1.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/skeezix-detail1.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/skeezix-detail5.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/skeezix-detail5.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/skeezix-detail6.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/skeezix-detail6.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/skeezixinneverwhere.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/skeezixinneverwhere.jpg)\n\n ###### ABOUT SKEEZIX: (from Wikipedia)\n\n ###### Early years\n\n The strip originated on the *Chicago Tribune’*s black-and-white Sunday page, *The Rectangle*, where staff artists contributed one-shot panels, continuing plots or themes. One corner of *The Rectangle* introduced King’s *Gasoline Alley*, where characters Walt, Doc, Avery and Bill held weekly conversations about automobiles. This panel slowly gained recognition, and the daily strip began August 24, 1919 in the *New York Daily News*.  ###### Skeezix arrives\n\n The early years were dominated by the character Walt Wallet. *Tribune* editor Joseph Patterson wanted to attract women to the strip by introducing a baby, but Walt was not married. That obstacle was avoided when Walt found a baby on his doorstep, as described by comics historian Don Markstein:  [![](https://i0.wp.com/upload.wikimedia.org/wikipedia/en/thumb/9/9d/Skeezixandnina.jpg/220px-Skeezixandnina.jpg)](http://en.wikipedia.org/wiki/File:Skeezixandnina.jpg)   [![](https://i0.wp.com/bits.wikimedia.org/skins-1.17/common/images/magnify-clip.png)](http://en.wikipedia.org/wiki/File:Skeezixandnina.jpg \&quot;Enlarge\&quot;) Promotional art by Frank King (c. 1941), highlighting Skeezix’s marriage proposal to Nina Clock.\n\n   After a couple of years, the *Tribune’*s editor, Captain Joseph Patterson, whose influence would later have profound effects on such strips as *Terry and the Pirates* and *Little Orphan Annie*, decided the strip should have something to appeal to women, as well, and suggested King add a baby. Only problem was the main character, Walt Wallet, was a confirmed bachelor. On February 14, 1921, Walt found the necessary baby abandoned on his doorstep. That was the day *Gasoline Alley* entered history as the first comic strip in which the characters aged normally. (Hairbreadth Harry had grown up in his strip, but stopped aging in his early 20s.) The baby, named Skeezix (cowboy slang for a motherless calf), grew up, fought in World War II, and is now a retired grandfather. Walt married after all, and had more children, who had children of their own. More characters entered the storyline on the periphery and some grew to occupy center stage.  Skeezix called his adopted father Uncle Walt. Unlike most comic strip children (like the Katzenjammer Kids or Little Orphan Annie) he did not remain a baby or even a little boy for long. He grew up to manhood, the first occasion where real time continually elapsed in a major comic strip over generations. By the time the United States entered World War II, Skeezix was a fully-grown adult, courting girls and serving in the armed forces. He later married Nina Clock and had children. In the late 1960s he faced a typical midlife crisis. Walt Wallet himself had married Phyllis Blossom and had other children, who grew up and had kids of their own. During the 1970s and 1980s, under Dick Moores’ authorship, the characters briefly stopped aging. When Jim Scancarelli took over, the natural aging was restored. ###### About NEVERWHERE: (from Amazon)\n\n Neverwhere is the companion novelization by Neil Gaiman of the television serial Neverwhere, by Neil Gaiman and Lenny Henry. The plot and characters are exactly the same as in the series, with the exception that the novel form allowed Gaiman to expand and elaborate on certain elements of the story and restore changes made in the televised version from his original plans. Most notable is the appearance of the Floating Market at Harrods (in the novel) rather than under Battersea power station (the tv series). This was changed due to the management of Harrods changing their mind about proposed filming. The novel was originally released by BBC Books in 1996, three episodes into the television series run. It was accompanied by a spoken word CD and cassette release, also by the BBC. The novel enjoyed great success, whereas its television roots did not receive as much international exposure as the novel. In addition to being translated into various languages, it was also re-published as an ‘Author’s Preferred Text’ version, (a combination of the international and original English version, with additional scenes re-inserted by Gaiman) alongside American Gods in 2006. The original BBC Books version had a cover by long time Gaiman collaborator Dave McKean, taken from the birds head rings, flaming fist and London Underground styled graphics created by McKean for the series, as well as a brief section by Gaiman on the making of the series.&quot;],&quot;collection&quot;:[0,&quot;portfolio&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Skeezix in Neverwhere&quot;],&quot;date&quot;:[0,&quot;2012-03-08T13:14:06&quot;],&quot;aws_media_src_url&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/skeezix-detail3.jpg&quot;]}],&quot;render&quot;:[0,null],&quot;date&quot;:[0,&quot;2012-03-08T13:14:06&quot;],&quot;title&quot;:[0,&quot;Skeezix in Neverwhere&quot;],&quot;img&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/skeezix-detail3.jpg&quot;]}],[0,{&quot;id&quot;:[0,&quot;2012/03/false-idol.md&quot;],&quot;slug&quot;:[0,&quot;false-idol&quot;],&quot;body&quot;:[0,&quot;\n The first in my “False Idol” Series.  \n Cow Skull, Mosaic with glass, bone, brass, steel, aluminum, copper, plaster, clock parts, plumbing parts, vintage steam gauge, air gauge, and more.\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/falseidol-1-lw.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/falseidol-1-lw.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/falseidol-2-lw.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/falseidol-2-lw.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/falseidol-3.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/falseidol-3.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/falseidol-detail-lw.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/falseidol-detail-lw.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/falseidol-detail2-lw.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/falseidol-detail2-lw.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/falseidol-detail3-lw.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/falseidol-detail3-lw.jpg)&quot;],&quot;collection&quot;:[0,&quot;portfolio&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;False Idol&quot;],&quot;date&quot;:[0,&quot;2012-03-08T13:09:35&quot;],&quot;aws_media_src_url&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/falseidol-1-lw.jpg&quot;]}],&quot;render&quot;:[0,null],&quot;date&quot;:[0,&quot;2012-03-08T13:09:35&quot;],&quot;title&quot;:[0,&quot;False Idol&quot;],&quot;img&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/falseidol-1-lw.jpg&quot;]}],[0,{&quot;id&quot;:[0,&quot;2012/03/ideas-hold-worth.md&quot;],&quot;slug&quot;:[0,&quot;ideas-hold-worth&quot;],&quot;body&quot;:[0,&quot;\n I spotted this rusty old caboose sitting on a siding near work a few weeks ago. It was so rusty and unique I had to run home and get my camera. Took a bunch of pictures, and then did a little Photoshop work on them.\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/ideasholdworth1.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/ideasholdworth1.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/ideasholdworth2.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/ideasholdworth2.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/ideasholdworth3.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/ideasholdworth3.jpg)&quot;],&quot;collection&quot;:[0,&quot;portfolio&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Ideas Hold Worth&quot;],&quot;date&quot;:[0,&quot;2012-03-08T12:54:25&quot;],&quot;aws_media_src_url&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/ideasholdworth1.jpg&quot;]}],&quot;render&quot;:[0,null],&quot;date&quot;:[0,&quot;2012-03-08T12:54:25&quot;],&quot;title&quot;:[0,&quot;Ideas Hold Worth&quot;],&quot;img&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/ideasholdworth1.jpg&quot;]}],[0,{&quot;id&quot;:[0,&quot;2012/03/worm-holes-and-the-space-time-continuum.md&quot;],&quot;slug&quot;:[0,&quot;worm-holes-and-the-space-time-continuum&quot;],&quot;body&quot;:[0,&quot;\n Years ago, a friend gave me this large knot that was cut off a tree on his upstate NY land. Once I removed all the bark, there were worms that were still living in the wood, eating little tunnels in the wood, and leaving little piles of wood dust where I had left the piece to dry out. I eventually got rid of the worms, but expanded on the worm hole theme. This was NOT CARVED at all, besides the darkened grooves. The tree had grown this shape, with the “nose” and hollowed back. Added old clock &amp; watch parts, wood is finished with tung oil.\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/worm-holes-the-space-time-continuum-a.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/worm-holes-the-space-time-continuum-a.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/worm-holes-the-space-time-continuum-j.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/worm-holes-the-space-time-continuum-j.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/worm-holes-the-space-time-continuum-k.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/worm-holes-the-space-time-continuum-k.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/worm-holes-lw-blk.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/worm-holes-lw-blk.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/worm-holes-lw.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/worm-holes-lw.jpg)&quot;],&quot;collection&quot;:[0,&quot;portfolio&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Worm Holes and the Space-Time Continuum&quot;],&quot;date&quot;:[0,&quot;2012-03-08T12:47:17&quot;],&quot;aws_media_src_url&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/worm-holes-the-space-time-continuum-a.jpg&quot;]}],&quot;render&quot;:[0,null],&quot;date&quot;:[0,&quot;2012-03-08T12:47:17&quot;],&quot;title&quot;:[0,&quot;Worm Holes and the Space-Time Continuum&quot;],&quot;img&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/worm-holes-the-space-time-continuum-a.jpg&quot;]}],[0,{&quot;id&quot;:[0,&quot;2012/03/heavy-metal.md&quot;],&quot;slug&quot;:[0,&quot;heavy-metal&quot;],&quot;body&quot;:[0,&quot;\n Guitar Sculpture using plywood, scrap metal, clock parts, sewing machine parts, camera parts, steel, stainless steel, brass, copper, aluminum, glass, and more. For entry in the Carmel, IN Arts and Design works, and keeps good time!\n\n Made from old german clock parts, steel frame, brass, aluminum, stainless steel, and copper.\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/stigmatism3-md-blk.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/stigmatism3-md-blk.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/astigmatism-lw-2.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/astigmatism-lw-2.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/astigmatism1-blk.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/astigmatism1-blk.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/astigmatism2-blk.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/astigmatism2-blk.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/astigmatism-closeup-blk-md.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/astigmatism-closeup-blk-md.jpg)&quot;],&quot;collection&quot;:[0,&quot;portfolio&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Astigmatism&quot;],&quot;date&quot;:[0,&quot;2012-03-08T10:58:39&quot;],&quot;aws_media_src_url&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/stigmatism3-md-blk.jpg&quot;]}],&quot;render&quot;:[0,null],&quot;date&quot;:[0,&quot;2012-03-08T10:58:39&quot;],&quot;title&quot;:[0,&quot;Astigmatism&quot;],&quot;img&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/stigmatism3-md-blk.jpg&quot;]}],[0,{&quot;id&quot;:[0,&quot;2012/03/memento-mori.md&quot;],&quot;slug&quot;:[0,&quot;memento-mori&quot;],&quot;body&quot;:[0,&quot;\n Another Mosaic Clock using Marble, granite, pottery, glass, china, turquoise, &amp; wood. About 24″ x 48″. Quartz Clock.\n\n ***Memento mori*** is a [Latin phrase](http://en.wikipedia.org/wiki/List_of_Latin_phrases \&quot;List of Latin phrases\&quot;) translated as “Remember your mortality”, “Remember you must die” or “Remember you will die” It names a [genre](http://en.wikipedia.org/wiki/Genre \&quot;Genre\&quot;) of artistic work which varies widely, but which all share the same purpose: to remind people of their own mortality. The phrase has a tradition in art that dates back to antiquity.\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/mementomori.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/mementomori.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/mementomori-clock-detail.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/mementomori-clock-detail.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/mementomori-detail.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/mementomori-detail.jpg)&quot;],&quot;collection&quot;:[0,&quot;portfolio&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Memento Mori&quot;],&quot;date&quot;:[0,&quot;2012-03-08T10:53:32&quot;],&quot;aws_media_src_url&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/mementomori.jpg&quot;]}],&quot;render&quot;:[0,null],&quot;date&quot;:[0,&quot;2012-03-08T10:53:32&quot;],&quot;title&quot;:[0,&quot;Memento Mori&quot;],&quot;img&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/mementomori.jpg&quot;]}],[0,{&quot;id&quot;:[0,&quot;2012/03/mama-kilimanjaro.md&quot;],&quot;slug&quot;:[0,&quot;mama-kilimanjaro&quot;],&quot;body&quot;:[0,&quot;\n My latest in the Industrialized Africa series.\n\n Wood, brass, copper, silver, gold, stainless steel, steel, broken glass, old clock parts, old brass compass, quartz crystal, old silver coin, twine.\n\n I climbed Mt. Kilimanjaro back in 1990, the non-tourist Umbwe route, which turned into a difficult 8-day trek, one that changed my life forever.\n\n According to some, the name “Kilimanjaro” comes Kilima (Swahili for “hill, little mountain”) and Njaro, an ancient Swahili word for white or for shining. unfortunately there is very little “white” left, as most of the glaciers are disappearing.\n\n This sculpture was meant to remind us that global warming is affecting the earth in many ways, and that time is running out for this jewel of a mountain. It may not always “shine” as it once did.\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/mamakilimanjaro-a.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/mamakilimanjaro-a.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/mamakilimanjaro-bb.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/mamakilimanjaro-bb.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/mamakilimanjaro-c.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/mamakilimanjaro-c.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/mamakilimanjaro-d.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/mamakilimanjaro-d.jpg)\n\n [![Image](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/mamakilimanjaro-ee.jpg?w=487)](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/mamakilimanjaro-ee.jpg)&quot;],&quot;collection&quot;:[0,&quot;portfolio&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Mama Kilimanjaro&quot;],&quot;date&quot;:[0,&quot;2012-03-08T10:50:08&quot;],&quot;aws_media_src_url&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/mamakilimanjaro-a.jpg&quot;]}],&quot;render&quot;:[0,null],&quot;date&quot;:[0,&quot;2012-03-08T10:50:08&quot;],&quot;title&quot;:[0,&quot;Mama Kilimanjaro&quot;],&quot;img&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/03/mamakilimanjaro-a.jpg&quot;]}],[0,{&quot;id&quot;:[0,&quot;2012/03/industrialized-africa-iii-more-pix.md&quot;],&quot;slug&quot;:[0,&quot;industrialized-africa-iii-more-pix&quot;],&quot;body&quot;:[0,&quot;\n #3 in the “Industrialized Africa” Series.  \n Wood, brass, steel, stainless steel, copper, cloth, cowrie shells,
