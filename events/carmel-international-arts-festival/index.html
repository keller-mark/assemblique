ent="only" opts="{&quot;name&quot;:&quot;ItemPage&quot;,&quot;value&quot;:&quot;react&quot;}" await-children=""><template data-astro-template> <p>Thanks to all who stopped by my booth at the Art Festival this weekend. It was interesting to meet other assemblage artists and fans, and to share ideas with all the people who enjoy seeing something different.</p>
<p>Don’t forget to visit The Renaissance Fine Art &#x26; Design Gallery occasionally to see my latest pieces, as well as other fine works of art. 1 South Range Line Road, Carmel, IN 46032 • 317.506.8477</p>
<p><a href="//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/09/new-ren-gallery-1.jpg"><img src="//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2012/09/new-ren-gallery-1.jpg?w=419" alt="Image"></a></p>
