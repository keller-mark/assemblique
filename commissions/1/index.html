&quot;\nCommission completed. The client’s family had a large set of brass cutlery from Siam (now Thailand) which had special meaning to them, and asked that I create three sculptures from the set. This is the second of the three. One more to go. \\#familyheirlooms \\#upcycledsculpture \\#siamcutlery \\#forksspoonsandknives \\#commissionedsculpture \\#assembliquewebsite\\_commissions\n\n\n![](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2024/09/2024-09-16_22-36-29_UTC_2.jpg)\n![](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2024/09/2024-09-16_22-36-29_UTC_3.jpg)\n![](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2024/09/2024-09-16_22-36-29_UTC_1.jpg)\n![](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2024/09/2024-09-16_22-36-29_UTC_4.jpg)\n![](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2024/09/2024-09-16_22-36-29_UTC_5.jpg)\n![](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2024/09/2024-09-16_22-36-29_UTC_6.jpg)\n  \n[View on Instagram](https://www.instagram.com/p/C__rmwnOe9f/)&quot;],&quot;collection&quot;:[0,&quot;commissions&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Commission completed. The client’s family had a large set of brass cutlery from Siam (now Thailand) which had special meaning to them, and a&quot;],&quot;date&quot;:[0,&quot;2024-09-16&quot;],&quot;aws_media_src_url&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2024/09/2024-09-16_22-36-29_UTC_2.jpg&quot;]}],&quot;render&quot;:[0,null],&quot;date&quot;:[0,&quot;2024-09-16&quot;],&quot;title&quot;:[0,&quot;Commission completed. The client’s family had a large set of brass cutlery from Siam (now Thailand) which had special meaning to them, and a&quot;],&quot;img&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2024/09/2024-09-16_22-36-29_UTC_2.jpg&quot;]}],[0,{&quot;id&quot;:[0,&quot;2018/01/ig-BdZDBWvlHzm.md&quot;],&quot;slug&quot;:[0,&quot;ig-BdZDBWvlHzm&quot;],&quot;body&quot;:[0,&quot;\nCommissioned piece for Allison R., who donated a whole box full of antique clock parts. Her father used to repair clocks, so this mask will be a nice gift for her mother. #recycledart #repurposedart #upcycledart #clockgears #commissionedart #antiqueclocks \n\n![](//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2018/01/2018-01-01_03-14-05_UTC.jpg)   \n[View on Instagram](https://www.instagram.com/p/BdZDBWvlHzm/)&quot;],&quot;collection&quot;:[0,&quot;commissions&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Commissioned piece for Allison R., who donated a whole box full of antique clock parts. Her father used to repair clocks, so this mask will &quot;],&quot;date&quot;:[0,&quot;2018-01-01&quot;],&quot;aws_media_src_url&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2018/01/2018-01-01_03-14-05_UTC.jpg&quot;]}],&quot;render&quot;:[0,null],&quot;date&quot;:[0,&quot;2018-01-01&quot;],&quot;title&quot;:[0,&quot;Commissioned piece for Allison R., who donated a whole box full of antique clock parts. Her father used to repair clocks, so this mask will &quot;],&quot;img&quot;:[0,&quot;//pub-5541d2355e6941b4a5fe50450aba723b.r2.dev/2018/01/2018-01-01_03-14-05_UTC.jpg&quot;]}],[0,{&quot;id&quot;:[0,&quot;2016/11/ben-grady-commission.md&quot;],&quot;slug&quot;:[0,&quot;ben-grady-commission&quot;],&quot;body&quot;:[0,&quot;\n “Ben Grady”\n\n 24″H x 11″W x 5″D\n\n Commissioned by Sheri A., made from her father’s parts. He had owned a business telephone company back in the day, and had left her many bins full of old parts, vintage electronics, etc. She asked me to use them to create some masks using his parts, and Ben Grady is the first.\n\n Parts include:\n\n  * Alligator clips\n * Ceramic disk capacitors\n * vintage camera lenses,\n * cast metal eagle wing parts\n * Antique brass lamp parts\n * Hexagon key tags\n * Vintage wood and horse hair brushes\n * Vintage indicator light bulbs\n  There is an LED light inside one of his eyes, the last photo shows Ben with the LED turned on.\n\n ![img_1914](//pub-5541d2355e6941b4a5fe50450ab
